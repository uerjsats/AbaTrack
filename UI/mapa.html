<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
        .leaflet-container { font-size: 1rem; }
        .aviao { text-align: center; line-height: 24px; }
        #contador {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(255,255,255,0.9); padding: 6px 10px;
            border-radius: 6px; font: 14px sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="contador">Aviões: 0</div>

<script>
    // ---------------------------------------------------------------
    // Mapa
    // ---------------------------------------------------------------
    var CENTRO = [-22.546472, -42.444504];

    var map = L.map("map", {
        center: CENTRO,
        zoom: 14,
        zoomControl: true,
        preferCanvas: false
    });

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        minZoom: 0,
        maxZoom: 19,
        maxNativeZoom: 19,
        attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors"
    }).addTo(map);

    // ---------------------------------------------------------------
    // "Satélite" (marcador principal + círculo de 2 km)
    // ---------------------------------------------------------------
    var marker = L.marker(CENTRO).addTo(map);
    marker.bindPopup("<b>Satélite</b>");

    var circle = L.circle(CENTRO, {
        color: "blue",
        fillColor: "blue",
        fillOpacity: 0.2,
        radius: 2000
    }).addTo(map);

    // false = a câmera fica livre (não é movida pelas atualizações).
    // Chame definirSeguirSatelite(true) para voltar a acompanhar o satélite.
    var seguirSatelite = false;

    function definirSeguirSatelite(valor) {
        seguirSatelite = !!valor;
    }

    function atualizarPosicao(lat, lng) {
        marker.setLatLng([lat, lng]);
        circle.setLatLng([lat, lng]);
        if (seguirSatelite) map.setView([lat, lng]);
    }

    // ---------------------------------------------------------------
    // Aviões (ADS-B)
    // ---------------------------------------------------------------
    var avioes = {};              // icao -> {marker, ultimo}
    var TEMPO_LIMITE = 60000;     // remove avião sem atualização após 60 s

    function iconeAviao(rumo) {
        // fa-plane aponta para a direita (leste), por isso rumo - 90
        return L.divIcon({
            className: "",
            html: '<div class="aviao" style="transform: rotate(' + (rumo - 90) + 'deg);' +
                  'font-size:22px; color:#1a4fa3; text-shadow:0 0 3px white;">' +
                  '<i class="fa-solid fa-plane"></i></div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });
    }

    function atualizarContador() {
        document.getElementById("contador").textContent =
            "Aviões: " + Object.keys(avioes).length;
    }

    function atualizarAviao(icao, lat, lng, rumo, alt, vel, callsign) {
        var texto = "<b>" + (callsign || icao) + "</b><br>" +
                    "ICAO: " + icao + "<br>" +
                    "Alt: " + alt + " ft<br>" +
                    "Vel: " + vel + " kt<br>" +
                    "Rumo: " + rumo + "°";

        var pos = [lat, lng];

        if (avioes[icao]) {
            var a = avioes[icao];
            a.marker.setLatLng(pos);
            a.marker.setIcon(iconeAviao(rumo));
            a.marker.setTooltipContent(texto);
            a.ultimo = Date.now();
        } else {
            var m = L.marker(pos, { icon: iconeAviao(rumo) }).addTo(map);
            m.bindTooltip(texto, { direction: "top" });
            avioes[icao] = { marker: m, ultimo: Date.now() };
            atualizarContador();
        }
    }

    function removerAviao(icao) {
        if (avioes[icao]) {
            map.removeLayer(avioes[icao].marker);
            delete avioes[icao];
            atualizarContador();
        }
    }

    function limparAvioes() {
        Object.keys(avioes).forEach(removerAviao);
    }

    // Remove aviões que deixaram de transmitir
    setInterval(function () {
        var agora = Date.now();
        Object.keys(avioes).forEach(function (icao) {
            if (agora - avioes[icao].ultimo > TEMPO_LIMITE) removerAviao(icao);
        });
    }, 5000);
</script>
</body>
</html>
